name: Publicar paquete

on:
  push:
    tags:
      - "security/v*"
      - "hosting/v*"

permissions:
  contents: read

jobs:
  publish:
    name: Empaquetar y publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Resolver paquete y versión desde el tag
        id: target
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="${TAG%%/*}"
          version="${TAG#*/v}"
          case "$package" in
            security) project="src/LL.Security/LL.Security.csproj" ;;
            hosting)  project="src/LL.Hosting/LL.Hosting.csproj" ;;
            *) echo "Paquete desconocido en el tag: $package"; exit 1 ;;
          esac
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restaurar dependencias
        run: dotnet restore SharedDotnet.sln

      - name: Compilar con la versión del tag
        run: >
          dotnet build SharedDotnet.sln
          -c Release --no-restore
          -p:Version=${{ steps.target.outputs.version }}

      - name: Ejecutar pruebas antes de publicar
        run: dotnet test SharedDotnet.sln -c Release --no-build --no-restore

      - name: Empaquetar
        run: >
          dotnet pack "${{ steps.target.outputs.project }}"
          -c Release --no-build
          -p:Version=${{ steps.target.outputs.version }}
          -o "$RUNNER_TEMP/paquetes"

      - name: Publicar en GitHub Packages
        run: |
          set -euo pipefail
          nupkg="$(find "$RUNNER_TEMP/paquetes" -name '*.nupkg' -print -quit)"
          dotnet nuget push "$nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
